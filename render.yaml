services:
  - type: web
    name: healthcare-rcm-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-rcm-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: healthcare-rcm-db
    plan: free
    databaseName: healthcare_rcm
    user: healthcare_user
